<h1>Page not found</h1>

<p id="redirect-status">Checking for a matching page&hellip;</p>

<p>If you are not redirected automatically, the page you requested may have
moved. Try the <a href="{{ '/' | relative_url }}">home page</a> or the search
box above.</p>

<script>
  // URLs on GitHub Pages are case-sensitive, but many links to this site use
  // different casing (e.g. /docs/iv/ vs /docs/IV/). This map is generated at
  // build time from every real page on the site, keyed by its lower-cased URL,
  // so we can redirect a mis-cased request to the correct page.
  var PAGES = {
    {% for page in site.html_pages -%}
      {%- assign real = page.url | relative_url -%}
      "{{ real | downcase }}": "{{ real }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}
  };

  (function () {
    function normalize(path) {
      // Drop query/hash, ensure a single trailing slash for directory-style URLs.
      path = path.replace(/[?#].*$/, "");
      if (path.length > 1 && !/\.[a-z0-9]+$/i.test(path) && !path.endsWith("/")) {
        path += "/";
      }
      return path;
    }

    var requested = normalize(window.location.pathname);
    var target = PAGES[requested.toLowerCase()];

    if (target && target !== requested) {
      document.getElementById("redirect-status").textContent =
        "Redirecting to the correct page…";
      window.location.replace(target + window.location.search + window.location.hash);
    } else {
      document.getElementById("redirect-status").textContent =
        "Sorry, we couldn't find that page.";
    }
  })();
</script>
